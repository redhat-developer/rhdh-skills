name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-python:
    runs-on: ubuntu-latest
    outputs:
      min-version: ${{ steps.resolve.outputs.min }}
      max-version: ${{ steps.resolve.outputs.max }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: resolve
        run: |
          python3 << 'PYEOF' >> "$GITHUB_OUTPUT"
          import re, json
          with open('pyproject.toml') as f:
              spec = re.search(r'requires-python\s*=\s*"([^"]+)"', f.read())
          spec = spec.group(1) if spec else '>=3.9'
          min_m = re.search(r'>=\s*([\d.]+)', spec)
          max_m = re.search(r'<=?\s*([\d.]+)', spec)
          min_v = min_m.group(1) if min_m else '3.9'
          max_v = max_m.group(1) if max_m else '3.x'
          matrix = [min_v, max_v] if min_v != max_v else [min_v]
          print(f'min={min_v}')
          print(f'max={max_v}')
          print(f'matrix={json.dumps(matrix)}')
          PYEOF

  lint:
    needs: resolve-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.resolve-python.outputs.max-version }}

      - run: uv sync --frozen --extra dev

      - run: uv run ruff check .

      - run: uv run ruff format --check .

  test:
    needs: resolve-python
    # Pinned, unlike the other jobs, because the matrix includes this repo's
    # minimum Python and `ubuntu-latest` moved to 24.04 -> 26.04 on 2026-10-22.
    # `actions/setup-python` has no 3.9 build for 26.04 — 3.9 reached end of life
    # in October 2025, so new images are not being produced for it — and the
    # resulting failure takes out the whole matrix through fail-fast. Pin until
    # the floor in pyproject.toml moves past 3.9.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ${{ fromJson(needs.resolve-python.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: uv sync --frozen --extra dev

      - run: uv run pytest -v

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate catalog and composition graph
        run: python3 scripts/validate_skill_catalog.py --root .

      - name: Verify skills.sh discovery
        run: npx --yes skills@1.5.22 add . --list

      - name: Test JavaScript skill scripts
        run: node --test "skills/**/tests/*.test.mjs"

      - name: Lint shell skill scripts
        run: find skills -name '*.sh' -print0 | xargs -0 shellcheck --severity=warning

      - name: Build and smoke-test the standalone rhdh CLI
        run: |
          uv build
          python -m venv /tmp/rhdh-skills-wheel
          /tmp/rhdh-skills-wheel/bin/pip install dist/*.whl
          /tmp/rhdh-skills-wheel/bin/rhdh --help
          /tmp/rhdh-skills-wheel/bin/rhdh-local --help
          /tmp/rhdh-skills-wheel/bin/rhdh local --help
