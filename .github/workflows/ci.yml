name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-python:
    runs-on: ubuntu-latest
    outputs:
      min-version: ${{ steps.resolve.outputs.min }}
      max-version: ${{ steps.resolve.outputs.max }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: resolve
        run: |
          python3 << 'PYEOF' >> "$GITHUB_OUTPUT"
          import json
          # One CPython job: the newest 3.x that actions/setup-python offers
          # on the current ubuntu-latest image. A floating 3.x spec follows
          # the runner when ubuntu-latest moves. Do not also schedule the
          # requires-python floor. Ubuntu 26.04 does not publish CPython 3.9,
          # so setup-python fails with:
          #   The version '3.9' with architecture 'x64' was not found for Ubuntu 26.04.
          version = '3.x'
          print(f'min={version}')
          print(f'max={version}')
          print(f'matrix={json.dumps([version])}')
          PYEOF

  lint:
    needs: resolve-python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.resolve-python.outputs.max-version }}

      - run: uv sync --frozen --extra dev

      - run: uv run ruff check .

      - run: uv run ruff format --check .

  test:
    needs: resolve-python
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJson(needs.resolve-python.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: uv sync --frozen --extra dev

      - run: uv run pytest -v

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate catalog and composition graph
        run: python3 scripts/validate_skill_catalog.py --root .

      - name: Verify skills.sh discovery
        run: npx --yes skills@1.5.22 add . --list

      - name: Test JavaScript skill scripts
        run: node --test "skills/**/tests/*.test.mjs"

      - name: Lint shell skill scripts
        run: find skills -name '*.sh' -print0 | xargs -0 shellcheck --severity=warning

      - name: Smoke-test PR/MR opener and caller metadata
        run: |
          bash skills/ci/rhdh-pr-mr/tests/smoke.sh
          bash skills/ci/rhdh-yarn-bump/tests/smoke-caller.sh

      - name: Build and smoke-test the standalone rhdh CLI
        run: |
          uv build
          python -m venv /tmp/rhdh-skills-wheel
          /tmp/rhdh-skills-wheel/bin/pip install dist/*.whl
          /tmp/rhdh-skills-wheel/bin/rhdh --help
          /tmp/rhdh-skills-wheel/bin/rhdh-local --help
          /tmp/rhdh-skills-wheel/bin/rhdh local --help
