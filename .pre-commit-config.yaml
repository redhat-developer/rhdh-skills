repos:
  # Python linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^skills/third-party/  # vendored bytes are pinned by UPSTREAM.toml
      - id: end-of-file-fixer
        exclude: ^skills/third-party/
      - id: check-yaml
        args: ['--allow-multiple-documents']
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-json

  # Markdown linting
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.17.2
    hooks:
      - id: markdownlint-cli2
        args: ['--fix']
        exclude: ^\.planning/|^skills/third-party/

  # Secret detection
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: ['--severity=warning']

  # Keep the skills CLI grouping manifest aligned with the catalog
  - repo: local
    hooks:
      - id: generate-plugin-manifest
        name: generate .claude-plugin marketplace from catalog
        entry: uv run python scripts/generate_plugin_manifest.py --write
        language: system
        files: ^(skills/meta/setup-rhdh-skills/assets/catalog\.json|\.claude-plugin/marketplace\.json)$
        pass_filenames: false
        stages: [pre-commit]
      - id: pytest
        name: pytest
        entry: uv run pytest tests/ -q
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]
